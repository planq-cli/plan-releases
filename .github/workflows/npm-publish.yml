name: npm-publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing formal release tag (vX.Y.Z)
        required: true
        type: string
      dry_run:
        description: Prepare and preflight without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.14.0"
  NPM_VERSION: "11.20.0"

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      dry-run: ${{ steps.release.outputs.dry-run }}
    steps:
      - name: Check out publication tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Resolve formal release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$WORKFLOW_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
              echo "manual npm publication must use the default branch" >&2
              exit 1
            }
            tag="$INPUT_TAG"
            dry_run="$INPUT_DRY_RUN"
          else
            tag="$EVENT_TAG"
            dry_run="false"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "npm publication tag must be vX.Y.Z" >&2
            exit 1
          }
          printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"
          printf 'dry-run=%s\n' "$dry_run" >>"$GITHUB_OUTPUT"
      - name: Download immutable public Release
        run: |
          node scripts/download-release.mjs \
            --tag "${{ steps.release.outputs.tag }}" \
            --output "$RUNNER_TEMP/release"
      - name: Prepare exact npm tarballs
        run: |
          node scripts/prepare-npm.mjs \
            "$RUNNER_TEMP/release" \
            "$RUNNER_TEMP/publication"
      - name: Run anonymous registry preflight
        run: |
          node scripts/npm-release.mjs preflight \
            --directory "$RUNNER_TEMP/publication" \
            >"$RUNNER_TEMP/npm-preflight-v1.json"
          node --input-type=module - \
            "$RUNNER_TEMP/npm-preflight-v1.json" \
            "${{ steps.release.outputs.dry-run }}" <<'NODE'
          import fs from "node:fs";
          const [file, dryRun] = process.argv.slice(2);
          const result = JSON.parse(fs.readFileSync(file, "utf8"));
          const allowed = dryRun === "true"
            ? ["new", "resume-native", "resume-wrapper", "existing", "legacy-no-provenance", "conflict"]
            : ["new", "resume-native", "resume-wrapper", "existing"];
          if (!allowed.includes(result.state)) {
            throw new Error(`unsafe npm registry state: ${result.state}`);
          }
          NODE
      - name: Assemble immutable publication bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/bundle"
          mv "$RUNNER_TEMP/publication" "$RUNNER_TEMP/bundle/publication"
          cp scripts/npm-release.mjs "$RUNNER_TEMP/bundle/npm-release.mjs"
          cp "$RUNNER_TEMP/npm-preflight-v1.json" "$RUNNER_TEMP/bundle/"
      - name: Upload publication bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-publication-${{ steps.release.outputs.tag }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 7
      - name: Upload prepare evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-prepare-evidence-${{ steps.release.outputs.tag }}
          path: |
            ${{ runner.temp }}/bundle/publication/npm-publication-v1.json
            ${{ runner.temp }}/bundle/npm-preflight-v1.json
          if-no-files-found: error
          retention-days: 90

  smoke:
    name: smoke / ${{ matrix.target }}
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: windows-x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download publication bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-publication-${{ github.event.release.tag_name || inputs.tag }}
          path: ${{ runner.temp }}/bundle
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - name: Smoke exact platform tarballs
        shell: bash
        run: |
          node "$RUNNER_TEMP/bundle/npm-release.mjs" smoke \
            --directory "$RUNNER_TEMP/bundle/publication" \
            >"$RUNNER_TEMP/npm-smoke-${{ matrix.target }}-v1.json"
      - name: Upload platform smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-smoke-${{ matrix.target }}-${{ github.event.release.tag_name || inputs.tag }}
          path: ${{ runner.temp }}/npm-smoke-${{ matrix.target }}-v1.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish / npm-production
    needs:
      - prepare
      - smoke
    if: needs.prepare.outputs.dry-run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download publication bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-publication-${{ github.event.release.tag_name || inputs.tag }}
          path: ${{ runner.temp }}/bundle
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Revalidate and publish exact tarballs
        env:
          DRY_RUN: ${{ needs.prepare.outputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run true)
          fi
          node "$RUNNER_TEMP/bundle/npm-release.mjs" publish \
            --directory "$RUNNER_TEMP/bundle/publication" \
            "${args[@]}" \
            >"$RUNNER_TEMP/bundle/npm-publish-v1.json"
      - name: Upload publish evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
          path: ${{ runner.temp }}/bundle/npm-publish-v1.json
          if-no-files-found: error
          retention-days: 30

  verify:
    name: anonymous verify / ${{ matrix.target }}
    needs:
      - prepare
      - publish
    if: needs.prepare.outputs.dry-run != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: windows-x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download publication bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-publication-${{ github.event.release.tag_name || inputs.tag }}
          path: ${{ runner.temp }}/bundle
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Verify anonymous npm publication
        run: |
          node "$RUNNER_TEMP/bundle/npm-release.mjs" verify \
            --directory "$RUNNER_TEMP/bundle/publication" \
            >"$RUNNER_TEMP/npm-publication-${{ matrix.target }}-evidence-v1.json"
      - name: Upload anonymous verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-verify-${{ matrix.target }}-${{ github.event.release.tag_name || inputs.tag }}
          path: ${{ runner.temp }}/npm-publication-${{ matrix.target }}-evidence-v1.json
          if-no-files-found: error
          retention-days: 90
