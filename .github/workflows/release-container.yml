name: release-container

on:
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
      - name: Validate release repository boundary
        run: |
          node scripts/validate-repository.mjs
      - name: Check public release tooling syntax
        run: |
          node --check scripts/download-release.mjs
          node --check scripts/prepare-npm.mjs
          node --check scripts/npm-release.mjs
          node --check scripts/validate-repository.mjs
          node --check npm/planq/bin/planq.js
