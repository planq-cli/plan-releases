name: release-container

on:
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reject generated release payloads in Git
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z |
            grep -zE '(^|/)(target|dist)/|planq-[0-9].*\.(tar\.gz|zip)$|(^|/)bin/planq$'
          then
            echo "generated release payloads must remain in immutable Release assets" >&2
            exit 1
          fi
      - name: Check public release tooling
        run: |
          node --check scripts/prepare-npm.mjs
          node --check npm/planq/bin/planq.js
      - name: Enforce private npm publication boundary
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            .github/workflows/publish-platform-packages.yml \
            .github/workflows/publish-npm.yml
          do
            if test -e "$workflow"; then
              echo "npm publication must run in the private release controller: $workflow" >&2
              exit 1
            fi
          done
